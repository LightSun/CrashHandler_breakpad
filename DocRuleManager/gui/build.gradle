plugins {
    id 'java'
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    maven {url "https://maven.aliyun.com/nexus/content/groups/public"}
    maven { url "https://jitpack.io" }
    maven { url "https://maven.aliyun.com/repository/public" }
    maven { url 'https://maven.aliyun.com/repository/central' }

    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'

    implementation "com.github.LightSun.Java-base:base:1.2.7"
    implementation 'com.google.code.gson:gson:2.10'
}

test {
    useJUnitPlatform()
}

task pkgGuiLib(type: Jar) {
    archiveFileName = "libJGui.jar"
    from sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
//    manifest {
//        attributes("Main-Class": "com.heaven7.main.DocMainGenerator",
//                "Implementation-Title": "Gradle",
//                'Implementation-Version': version,
//        )
//    }
    dependsOn configurations.runtimeClasspath
//    from {
//        configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
//    }
}

task pkgMain(type: Jar) {
    archiveFileName = "libJGuiMain_BreakPad.jar"
    from sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes("Main-Class": "com.heaven7.gui.main.bp.BPMain",
                "Implementation-Title": "Gradle",
                'Implementation-Version': version,
        )
    }
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
    }
}